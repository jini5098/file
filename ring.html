<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동글</title>
<style>
:root{--paper:#F4EFE6;--ink:#2B2A28;--red:#D9503F;--mus:#E2B93B;--green:#5E9B5A;--card:#FBF8F1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none}
#dim{position:fixed;inset:0;background:rgba(43,42,40,.16);opacity:0;transition:opacity .18s}
#dim.on{opacity:1}
.doc{position:relative;width:84px;height:104px}
.doc .body{position:absolute;inset:0;background:var(--card);border:4px solid var(--ink);border-radius:9px 26px 9px 9px;box-shadow:5px 6px 0 rgba(43,42,40,.3)}
.doc .fold{position:absolute;right:-1px;top:-1px;width:28px;height:28px;background:var(--ink);border-radius:0 22px 0 8px;clip-path:polygon(0 0,100% 100%,0 100%)}
.doc .l{position:absolute;left:14px;height:5px;border-radius:3px;background:#D8D0C0}
.doc .ext{position:absolute;left:-10px;bottom:14px;background:var(--ink);color:var(--paper);font-weight:900;font-size:15px;padding:3px 9px;border-radius:7px;transform:rotate(-4deg);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tok{position:absolute;transform:translate(-50%,-50%);display:none;z-index:3}
#tok.pop .doc{animation:pop .3s}
@keyframes pop{0%{transform:scale(.4) rotate(-14deg)}70%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1)}}
#halo{position:absolute;border:3px dashed rgba(43,42,40,.45);background:rgba(244,239,230,.82);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .15s;z-index:1}
#halo.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.opt{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:4px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;cursor:pointer;box-shadow:4px 5px 0 rgba(43,42,40,.3);transform:translate(0,0) scale(0);transition:transform .32s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;z-index:2;background:var(--card)}
.opt small{font-size:10px;font-weight:700;opacity:.8;margin-top:1px}
.opt:hover{box-shadow:7px 9px 0 rgba(43,42,40,.3)}
.opt.busy{animation:spin .9s linear infinite;border-style:dashed}
.opt.done::after{content:"";position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid var(--ink)}
@keyframes spin{to{rotate:360deg}}
#info{position:absolute;transform:translateX(-50%);background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;box-shadow:0 4px 0 var(--ink);max-width:420px;text-align:center;display:none;z-index:6;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="dim"></div>
<div id="halo"></div>
<div id="tok"><div class="doc"><div class="body"></div><div class="fold"></div><div class="l" style="top:40px;width:44px"></div><div class="l" style="top:54px;width:52px"></div><div class="ext" id="ext"></div></div></div>
<div id="info"></div>
<script>const $=id=>document.getElementById(id);</script>
<script src="core.js"></script>
<script>
'use strict';
let files=[],opts=[],cx=0,cy=0,R=130,busy=false,hideT=null;
function info(t){const e=$('info');e.textContent=t;e.style.display=t?'block':'none';e.style.left=cx+'px';e.style.top=(cy+R+52)+'px';if(cy+R+110>innerHeight)e.style.top=(cy-R-96)+'px';}
function clearOpts(){for(const o of opts)o.el.remove();opts=[];}
function place(open){
 const n=opts.length;
 $('tok').style.left=cx+'px';$('tok').style.top=cy+'px';
 const h=$('halo');h.style.left=cx+'px';h.style.top=cy+'px';h.style.width=h.style.height=(R*2+96)+'px';h.classList.toggle('on',open);$('dim').classList.toggle('on',open);
 opts.forEach((o,i)=>{const a=-Math.PI/2+i*2*Math.PI/n+(n===2?Math.PI/2:0),x=Math.cos(a)*R,y=Math.sin(a)*R;o.el.style.left=cx+'px';o.el.style.top=cy+'px';o.el.style.transitionDelay=(open?i*40:0)+'ms';
  o.el.style.transform=open?'translate('+x+'px,'+y+'px) scale(1) rotate('+((i%2?1:-1)*3)+'deg)':'translate(0,0) scale(0)';});
}
function show(d){
 clearTimeout(hideT);busy=false;clearOpts();
 const pad=R+70;cx=Math.max(pad,Math.min(d.w-pad,d.x));cy=Math.max(pad,Math.min(d.h-pad-60,d.y));
 const first=d.files[0],kind=kindOf({name:first.name,type:''});
 $('tok').style.display='block';$('tok').classList.remove('pop');void $('tok').offsetWidth;$('tok').classList.add('pop');
 const e=extOf(first.name).toUpperCase()||'?';
 if(!kind){files=[];$('ext').textContent=e;place(true);info('이 파일은 아직 못 바꿔 ('+first.name+')');hideT=setTimeout(()=>window.api.hide(),2200);return;}
 files=d.files.filter(f=>kindOf({name:f.name,type:''})===kind);
 $('ext').textContent=files.length>1?e+' ×'+files.length:e;
 const cur=e==='JPEG'?'JPG':e==='HTM'?'HTML':e==='MARKDOWN'?'MD':e;
 for(const t of TARGETS[kind].filter(t=>t!==cur)){
  const el=document.createElement('div');el.className='opt';el.style.background=COL[t]||'#FBF8F1';el.innerHTML=t+'<small>'+(NOTE[t]||'')+'</small>';
  el.addEventListener('click',ev=>{ev.stopPropagation();run(t,el);});document.body.appendChild(el);opts.push({t,el});}
 place(false);requestAnimationFrame(()=>requestAnimationFrame(()=>place(true)));
 info(files.length>1?first.name+' 외 '+(files.length-1)+'개':first.name);
}
async function run(t,el){
 if(busy)return;busy=true;el.classList.add('busy');
 try{
  let last='';
  for(let i=0;i<files.length;i++){
   info(files.length>1?(i+1)+' / '+files.length+' 바꾸는 중…':'바꾸는 중…');
   const f=files[i],bytes=await window.api.read(f.path);
   const out=await convert(new File([bytes],f.name),t);
   last=await window.api.save(f.path,out.name,new Uint8Array(await out.blob.arrayBuffer()));
  }
  el.classList.remove('busy');el.classList.add('done');
  const nm=last.split(/[\\/]/).pop();
  info(files.length>1?files.length+'개 저장했어 (원본 옆에)':'저장했어: '+nm);
  hideT=setTimeout(()=>window.api.hide(),1300);
 }catch(e){el.classList.remove('busy');busy=false;info('바꾸지 못했어: '+(e&&e.message||e));}
}
window.api.onShow(show);
window.api.onHidden(()=>{clearTimeout(hideT);clearOpts();$('tok').style.display='none';$('halo').classList.remove('on');$('dim').classList.remove('on');info('');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.api.hide();});
$('dim').addEventListener('click',()=>{if(!busy)window.api.hide();});
</script>
</body>
</html>
